name: Publish CoolSnesh Downloads Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, publish and create release
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag and set application version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Invalid release tag '$tag'. Use vMAJOR.MINOR.PATCH, for example v1.0.0."
          }

          $version = $Matches['version']
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Publishing application version $version from tag $tag"

      - name: Restore dependencies
        run: dotnet restore .\CoolSnesh.Avalonia.sln

      - name: Run tests
        run: dotnet test .\CoolSnesh.Avalonia.sln -c Release --no-restore

      - name: Build project
        run: dotnet build .\CoolSnesh.Avalonia.csproj -c Release --no-restore

      - name: Publish standalone Windows x64 application
        shell: pwsh
        run: |
          dotnet publish .\CoolSnesh.Avalonia.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            "-p:Version=$env:RELEASE_VERSION" `
            "-p:InformationalVersion=$env:RELEASE_VERSION" `
            -o .\artifacts\publish

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE"
          }

      - name: Normalize published executable filename
        shell: pwsh
        run: |
          $publishDir = Resolve-Path ".\artifacts\publish" -ErrorAction Stop
          $canonicalName = "CoolSnesh Downloads.exe"
          $canonicalPath = Join-Path $publishDir $canonicalName
          $aliases = @(
            "CoolSnesh.Downloads.exe",
            "CoolSnesh.Avalonia.exe",
            "CoolSneshDownloads.exe",
            "CoolSnesh-Downloads.exe"
          )

          $exeFiles = @(Get-ChildItem -LiteralPath $publishDir -Filter "*.exe" -File)
          if (-not (Test-Path -LiteralPath $canonicalPath)) {
            $candidates = @($exeFiles | Where-Object { $aliases -contains $_.Name })
            if ($candidates.Count -eq 0 -and $exeFiles.Count -eq 1) {
              $candidates = $exeFiles
            }
            if ($candidates.Count -ne 1) {
              Write-Host "Published files found:"
              Get-ChildItem -LiteralPath $publishDir | Format-Table Name, Length
              throw "Cannot uniquely identify the application EXE to rename to '$canonicalName'."
            }
            $originalName = $candidates[0].Name
            Move-Item -LiteralPath $candidates[0].FullName -Destination $canonicalPath
            Write-Host "Normalized executable filename: '$originalName' -> '$canonicalName'"
          }

          foreach ($alias in $aliases) {
            $aliasPath = Join-Path $publishDir $alias
            if (Test-Path -LiteralPath $aliasPath) {
              Remove-Item -LiteralPath $aliasPath -Force
              Write-Host "Removed duplicate apphost: $alias"
            }
          }

          $finalExe = Get-Item -LiteralPath $canonicalPath -ErrorAction Stop
          if ($finalExe.Length -lt 1000000) {
            throw "The executable is suspiciously small ($($finalExe.Length) bytes)."
          }
          Write-Host "Release executable ready: $($finalExe.FullName), $($finalExe.Length) bytes"

      - name: Package EXE, ZIP and calculate SHA-256
        shell: pwsh
        run: |
          $publishDir = ".\artifacts\publish"
          $exe = Join-Path $publishDir "CoolSnesh Downloads.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            Get-ChildItem $publishDir -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "Product executable was not found: $exe"
          }

          New-Item -ItemType Directory -Force -Path ".\artifacts" | Out-Null
          $exeHash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content `
            -Path ".\artifacts\CoolSneshDownloads-win-x64.exe.sha256" `
            -Value "$exeHash  CoolSnesh Downloads.exe" `
            -Encoding ascii

          $zip = ".\artifacts\CoolSneshDownloads-win-x64.zip"
          Compress-Archive `
            -Path (Join-Path $publishDir "*") `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force
          $zipHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content `
            -Path ".\artifacts\CoolSneshDownloads-win-x64.zip.sha256" `
            -Value "$zipHash  CoolSneshDownloads-win-x64.zip" `
            -Encoding ascii
          Write-Host "EXE SHA-256: $exeHash"
          Write-Host "ZIP SHA-256: $zipHash"

      - name: Remove legacy executable assets from an existing release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repo = $env:GITHUB_REPOSITORY
          $escapedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $releaseApi = "https://api.github.com/repos/$repo/releases/tags/$escapedTag"
          $response = Invoke-WebRequest -Uri $releaseApi -Headers $headers -SkipHttpErrorCheck

          if ($response.StatusCode -eq 404) {
            Write-Host "No existing Release for $($env:RELEASE_TAG); the next step will create it."
            exit 0
          }
          if ($response.StatusCode -ne 200) {
            throw "GitHub API returned HTTP $($response.StatusCode) while looking up the release."
          }

          $release = $response.Content | ConvertFrom-Json
          $legacyNames = @(
            "CoolSnesh.Downloads.exe",
            "CoolSnesh.Avalonia.exe",
            "CoolSneshDownloads.exe",
            "CoolSnesh-Downloads.exe"
          )
          foreach ($asset in $release.assets) {
            if ($legacyNames -contains $asset.name) {
              Write-Host "Removing stale executable asset '$($asset.name)' from $($env:RELEASE_TAG)."
              $deleteUrl = "https://api.github.com/repos/$repo/releases/assets/$($asset.id)"
              $deleteResponse = Invoke-WebRequest -Method Delete -Uri $deleteUrl -Headers $headers -SkipHttpErrorCheck
              if ($deleteResponse.StatusCode -ne 204) {
                throw "Failed to remove stale asset '$($asset.name)' (HTTP $($deleteResponse.StatusCode))."
              }
            }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CoolSnesh Downloads ${{ inputs.tag || github.ref_name }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            artifacts/publish/CoolSnesh Downloads.exe
            artifacts/CoolSneshDownloads-win-x64.exe.sha256
            artifacts/CoolSneshDownloads-win-x64.zip
            artifacts/CoolSneshDownloads-win-x64.zip.sha256
          fail_on_unmatched_files: true
